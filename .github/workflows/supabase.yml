name: Deploy Migrations
on:
  push:
    branches: [main]
    paths: ["packages/database/supabase/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target Supabase environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  supabase:
    name: Supabase Sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set dispatch target config
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.environment }}" in
            dev)     REF=otlrpaixphrtlwqhvdpl; PASS="${{ secrets.SUPABASE_DB_PASSWORD_DEV }}" ;;
            staging) REF=vsfkrbofqvssvmdwpfwr; PASS="${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}" ;;
            prod)    REF=cfhsxrmpzwzvjzwcimod; PASS="${{ secrets.SUPABASE_DB_PASSWORD_PROD }}" ;;
          esac
          echo "PROJECT_REF=$REF" >> $GITHUB_ENV
          echo "DB_PASS=$PASS" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the deploy BEFORE touching any environment if migrations collide
      # (duplicate versions, or a newly-added round HHMMSS that will collide).
      - name: Check migration timestamps
        run: node scripts/check-migration-timestamps.mjs --base ${{ github.event.before }}

      - name: Run migrations via workspace registry
        if: github.event_name != 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI }}
          SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_SECRET }}
          SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI: ${{ secrets.SUPABASE_AUTH_EXTERNAL_AZURE_REDIRECT_URI }}
        run: pnpm --filter ci ci:migrations

      - name: Run migrations against selected environment
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/database
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASS"
          echo y | supabase db push --linked --include-all
