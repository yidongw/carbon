name: Integration Tests (real DB)

# Runs the packages/database integration suite against a real Postgres
# (full Carbon schema: migrations + seed + seed_company + seedDemoData).
# Gated to `dev` so broken migrations/seed are caught before they reach staging,
# and to database changes so unrelated PRs don't pay the cost.

on:
  pull_request:
    branches: [dev]
    paths:
      - "packages/database/**"
      - ".github/workflows/integration-tests.yml"
  push:
    branches: [dev]
    paths:
      - "packages/database/**"
      - ".github/workflows/integration-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the default in packages/database/src/test/testDatabase.ts.
  # The harness reads this override; the workflow also uses it as the cache key.
  ITEST_POSTGRES_IMAGE: public.ecr.aws/supabase/postgres:15.8.1.085

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # Cache the ~2.9GB Postgres image as a gzipped `docker save` tarball so we
      # don't re-pull it from the registry on every run. Keyed to the image tag,
      # so bumping ITEST_POSTGRES_IMAGE naturally busts the cache.
      - name: Cache Postgres image
        id: pg-image-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/itest-pg-image
          key: itest-pg-image-${{ env.ITEST_POSTGRES_IMAGE }}

      - name: Load or pull Postgres image
        run: |
          set -euo pipefail
          TARBALL="$HOME/.cache/itest-pg-image/image.tar.gz"
          if [ -f "$TARBALL" ]; then
            echo "Loading cached image from $TARBALL"
            gunzip -c "$TARBALL" | docker load
          else
            echo "Pulling $ITEST_POSTGRES_IMAGE"
            docker pull "$ITEST_POSTGRES_IMAGE"
            mkdir -p "$(dirname "$TARBALL")"
            docker save "$ITEST_POSTGRES_IMAGE" | gzip > "$TARBALL"
          fi

      - name: Run integration tests
        run: pnpm --filter @carbon/database test:integration
