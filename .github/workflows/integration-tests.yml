name: Integration Tests (real DB)

# Runs the real-database integration suites on `dev`:
#   - packages/database: migrations + seed + seed_company + seedDemoData
#   - apps/erp: service functions over real PostgREST (supabase-js)
# Gated to `dev` so broken migrations/APIs are caught before staging, and to the
# relevant paths so unrelated PRs don't pay the cost.

on:
  pull_request:
    branches: [dev]
    paths:
      - "packages/database/**"
      - "apps/erp/app/**"
      - ".github/workflows/integration-tests.yml"
  push:
    branches: [dev]
    paths:
      - "packages/database/**"
      - "apps/erp/app/**"
      - ".github/workflows/integration-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the defaults in packages/database/src/test/dockerHarness.ts.
  # The harness reads these overrides; the workflow also uses them as cache keys.
  ITEST_POSTGRES_IMAGE: public.ecr.aws/supabase/postgres:15.8.1.085
  ITEST_POSTGREST_IMAGE: public.ecr.aws/supabase/postgrest:v14.10

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # Cache the (large) Docker images as gzipped `docker save` tarballs so we
      # don't re-pull them every run. Keyed to the image tags, so bumping a tag
      # naturally busts the cache.
      - name: Cache Docker images
        id: docker-image-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/itest-images
          key: itest-images-${{ env.ITEST_POSTGRES_IMAGE }}-${{ env.ITEST_POSTGREST_IMAGE }}

      - name: Load or pull Docker images
        run: |
          set -euo pipefail
          DIR="$HOME/.cache/itest-images"
          mkdir -p "$DIR"
          load_or_pull() {
            local image="$1" tar="$2"
            if [ -f "$tar" ]; then
              echo "Loading cached image from $tar"
              gunzip -c "$tar" | docker load
            else
              echo "Pulling $image"
              docker pull "$image"
              docker save "$image" | gzip > "$tar"
            fi
          }
          load_or_pull "$ITEST_POSTGRES_IMAGE" "$DIR/postgres.tar.gz"
          load_or_pull "$ITEST_POSTGREST_IMAGE" "$DIR/postgrest.tar.gz"

      - name: Database integration tests
        run: pnpm --filter @carbon/database test:integration

      - name: ERP API integration tests
        run: pnpm --filter erp test:integration
